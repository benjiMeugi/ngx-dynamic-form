<div class="relative flex items-center">
  <input
    type="text"
    [(ngModel)]="displayValue"
    (ngModelChange)="onTextInput($event)"
    (blur)="onBlur()"
    [disabled]="isDisabled"
    [tabindex]="tabIndex"
    placeholder="jj/mm/aaaa"
    maxlength="10"
    class="h-10 w-full border border-gray-200 rounded-lg px-3.5 py-2 pr-11 text-sm bg-white text-gray-900 placeholder:text-gray-400 transition-all duration-150 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 disabled:bg-gray-50 disabled:text-gray-400 disabled:cursor-not-allowed dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:disabled:bg-slate-800/60"
  />
  <input
    #nativeDate
    type="date"
    [attr.min]="minDate"
    [attr.max]="maxDate"
    [disabled]="isDisabled"
    (change)="onNativePick(nativeDate.value)"
    class="absolute right-1 opacity-0 w-8 h-8 cursor-pointer disabled:cursor-not-allowed"
    tabindex="-1"
  />
  <span class="absolute right-3 pointer-events-none text-gray-400 dark:text-slate-400 flex items-center">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
    </svg>
  </span>
</div>
