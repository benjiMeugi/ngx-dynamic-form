<div class="relative">
    <button 
        type="button" 
        [disabled]="isDisabled" 
        [tabindex]="tabIndex"
        (click)="toggleOpen()"
        class="min-h-[40px] w-full border border-gray-200 dark:border-slate-700 rounded-lg px-3.5 py-1.5 flex justify-between items-center bg-white dark:bg-slate-900 text-sm text-gray-900 dark:text-slate-100 transition-all duration-150 focus:outline-none focus:border-blue-500 dark:focus:border-blue-400 focus:ring-2 focus:ring-blue-500/20 disabled:bg-gray-50 disabled:text-gray-400 disabled:cursor-not-allowed dark:disabled:bg-slate-800/60 dark:disabled:text-slate-500"
        >
        @if (multiple) {
            @if (selectedValues.length > 0) {
                <div class="flex flex-wrap gap-1.5 flex-1 pr-2">
                    @for (val of selectedValues; track val) {
                    <span class="flex items-center gap-1.5 bg-gray-100 dark:bg-slate-800 text-gray-800 dark:text-slate-200 border border-gray-200/80 dark:border-slate-700 text-xs px-2.5 py-0.5 rounded-md font-medium">
                        {{ getLabel(val) }}
                        <span (click)="removeChip(val, $event)" class="cursor-pointer text-gray-400 hover:text-gray-700 dark:hover:text-slate-100 inline-flex items-center transition-colors">
                            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </span>
                    </span>
                    }
                </div>
            } @else {
                <span class="text-gray-400 dark:text-slate-500">{{ placeholder }}</span>
            }
        } @else {
            <span class="truncate text-left flex-1" [class.text-gray-400]="!selectedLabel" [class.dark:text-slate-500]="!selectedLabel">
                {{ selectedLabel || placeholder }}
            </span>
        }

        <div class="flex items-center gap-1.5 shrink-0 ml-2">
            @if (clearable && (multiple ? selectedValues.length > 0 : selectedValue)) {
            <span (click)="clearSelection($event)" class="text-gray-400 hover:text-gray-600 dark:text-slate-500 dark:hover:text-slate-300 cursor-pointer inline-flex items-center p-0.5 transition-colors">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </span>
            }
            <svg class="w-4 h-4 text-gray-400 dark:text-slate-500 transition-transform duration-200" [class.rotate-180]="isOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
        </div>
    </button>

    @if (isOpen) {
    <div class="absolute z-20 mt-1.5 w-full bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-lg shadow-xl overflow-hidden animate-in fade-in-50 duration-150">
        <input type="text" [(ngModel)]="searchTerm" (ngModelChange)="onSearchInput($event)"
            (click)="$event.stopPropagation()" placeholder="Rechercher..."
            class="w-full px-3.5 py-2 border-b border-gray-100 dark:border-slate-800 text-xs bg-transparent text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500 focus:outline-none" />

        <cdk-virtual-scroll-viewport itemSize="36" class="h-48" (scrolledIndexChange)="onScrolledIndexChange($event)">
            @for (opt of filteredItems; track opt.key) {
            <div (click)="selectOption(opt)"
                class="px-3.5 py-2 text-xs cursor-pointer hover:bg-blue-50/80 dark:hover:bg-slate-800/80 flex items-center gap-2.5 text-gray-800 dark:text-slate-200 transition-colors"
                [class.bg-blue-50]="!multiple && isSelected(opt)"
                [class.dark:bg-slate-800]="!multiple && isSelected(opt)"
                [class.font-semibold]="!multiple && isSelected(opt)">
                @if (multiple) {
                <input type="checkbox" [checked]="isSelected(opt)" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500 pointer-events-none" />
                }
                <span class="truncate">{{ opt.value }}</span>
            </div>
            }
            @if (loading) {
            <div class="px-3 py-3 text-xs text-gray-400 dark:text-slate-500 text-center">Chargement...</div>
            }
            @if (!loading && filteredItems.length === 0) {
            <div class="px-3 py-3 text-xs text-gray-400 dark:text-slate-500 text-center">Aucun résultat</div>
            }
        </cdk-virtual-scroll-viewport>
    </div>
    }
</div>
