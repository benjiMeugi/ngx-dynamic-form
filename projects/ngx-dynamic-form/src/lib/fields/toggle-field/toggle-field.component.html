<div class="flex items-center gap-3">
  <button
    type="button"
    role="switch"
    [attr.aria-checked]="value"
    [disabled]="isDisabled"
    [tabindex]="tabIndex"
    (click)="toggle()"
    class="relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500/20 disabled:opacity-50 disabled:cursor-not-allowed"
    [class.bg-blue-600]="value"
    [class.bg-gray-200]="!value"
    [class.dark:bg-slate-700]="!value"
  >
    <span
      class="pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-md ring-0 transition duration-200 ease-in-out"
      [class.translate-x-5]="value"
      [class.translate-x-0]="!value"
    ></span>
  </button>
  @if (label) {
    <span class="text-sm font-medium text-gray-700 dark:text-slate-300 cursor-pointer select-none" (click)="toggle()">
      {{ label }}
    </span>
  }
</div>
