<div class="h-10 flex border border-gray-200 dark:border-slate-700 rounded-lg overflow-hidden bg-white dark:bg-slate-900 transition-all duration-150 focus-within:border-blue-500 dark:focus-within:border-blue-400 focus-within:ring-2 focus-within:ring-blue-500/20" [class.opacity-60]="isDisabled">
  <div class="relative h-full">
    <button
      type="button"
      [disabled]="isDisabled"
      tabindex="-1"
      (click)="toggleOpen()"
      class="flex items-center gap-1.5 px-3 h-full bg-gray-50 dark:bg-slate-800 border-r border-gray-200 dark:border-slate-700 text-gray-700 dark:text-slate-300 disabled:cursor-not-allowed hover:bg-gray-100 dark:hover:bg-slate-750 transition-colors"
    >
      <span>{{ selectedCountry.flag }}</span>
      <span class="text-xs font-medium text-gray-600 dark:text-slate-300">{{ selectedCountry.dial }}</span>
      <svg class="w-3.5 h-3.5 text-gray-400 dark:text-slate-500 transition-transform duration-200" [class.rotate-180]="isOpen" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
      </svg>
    </button>

    @if (isOpen) {
      <div class="absolute z-20 mt-1 bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 shadow-xl rounded-lg w-64 overflow-hidden">
        <input
          type="text"
          (input)="onCountrySearch($any($event.target).value)"
          placeholder="Rechercher un pays..."
          class="w-full px-3 py-2 border-b border-gray-100 dark:border-slate-800 text-xs bg-transparent text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500 focus:outline-none"
        />
        <div class="max-h-48 overflow-auto py-1">
          @for (c of filteredCountries; track c.iso) {
            <div (click)="selectCountry(c)" class="px-3 py-2 text-xs hover:bg-blue-50 dark:hover:bg-slate-800/80 cursor-pointer flex gap-2 items-center text-gray-800 dark:text-slate-200 transition-colors">
              <span>{{ c.flag }}</span>
              <span class="flex-1 truncate">{{ c.name }}</span>
              <span class="text-gray-400 dark:text-slate-500">{{ c.dial }}</span>
            </div>
          }
        </div>
      </div>
    }
  </div>

  <input
    type="tel"
    [value]="displayValue"
    [disabled]="isDisabled"
    [tabindex]="tabIndex"
    (input)="onNumberInput($any($event.target).value)"
    (blur)="onBlur()"
    placeholder="6 12 34 56 78"
    class="flex-1 px-3.5 py-2 text-sm bg-transparent text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500 focus:outline-none disabled:bg-gray-50 disabled:text-gray-400 dark:disabled:bg-slate-800/60 dark:disabled:text-slate-500"
  />
</div>
