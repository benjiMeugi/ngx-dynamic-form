<div class="relative flex items-center">
  <input
    [type]="isVisible ? 'text' : 'password'"
    [value]="value"
    [disabled]="isDisabled"
    [placeholder]="placeholder"
    (input)="onInput($any($event.target).value)"
    (blur)="onBlur()"
    [tabindex]="tabIndex"
    class="h-10 w-full border border-gray-200 rounded-lg px-3.5 py-2 pr-11 text-sm bg-white text-gray-900 placeholder:text-gray-400 transition-all duration-150 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 disabled:bg-gray-50 disabled:text-gray-400 disabled:cursor-not-allowed dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:disabled:bg-slate-800/60"
  />
  @if (showToggle) {
    <button
      type="button"
      (click)="toggleVisibility()"
      class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none dark:text-slate-400 dark:hover:text-slate-200 transition-colors"
      [attr.aria-label]="isVisible ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
      tabindex="-1"
    >
      @if (isVisible) {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        </svg>
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      }
    </button>
  }
</div>
