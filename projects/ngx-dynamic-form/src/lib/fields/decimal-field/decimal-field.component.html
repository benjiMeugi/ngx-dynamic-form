<input
  type="text"
  inputmode="decimal"
  [value]="displayValue"
  [disabled]="isDisabled"
  [placeholder]="placeholder"
  [tabindex]="tabIndex"
  (input)="onInput($any($event.target).value)"
  (blur)="onBlur()"
  (keydown)="onKeyDown($event)"
  class="h-10 w-full border border-gray-200 rounded-lg px-3.5 py-2 text-sm bg-white text-gray-900 placeholder:text-gray-400 transition-all duration-150 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 disabled:bg-gray-50 disabled:text-gray-400 disabled:cursor-not-allowed dark:bg-slate-900 dark:border-slate-700 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-blue-400 dark:disabled:bg-slate-800/60"
/>
