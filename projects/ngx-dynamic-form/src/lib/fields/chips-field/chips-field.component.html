<div class="flex flex-col gap-1 w-full">
  <div
    class="flex flex-wrap items-center gap-1.5 min-h-10 w-full border border-gray-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-sm bg-white dark:bg-slate-900 transition-all duration-150 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 dark:focus-within:border-blue-400"
    [class.opacity-60]="isDisabled"
    [class.cursor-not-allowed]="isDisabled"
    [class.border-red-500]="!!errorMessage"
    (click)="focusInput()"
  >
    @for (chip of chips; track $index) {
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-medium bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-900/50 select-none animate-in fade-in duration-150">
        <span class="truncate max-w-[200px]">{{ chip }}</span>
        @if (!isDisabled) {
          <button
            type="button"
            (click)="$event.stopPropagation(); removeChip($index)"
            class="text-blue-500 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-200 hover:bg-blue-100 dark:hover:bg-blue-900/60 rounded-full p-0.5 transition-colors cursor-pointer"
            aria-label="Supprimer ce tag"
          >
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        }
      </span>
    }

    <input
      #inputEl
      type="text"
      [(ngModel)]="inputValue"
      [placeholder]="chips.length === 0 ? (placeholder || chipsConfig?.placeholder || 'Saisir et appuyer sur Entrée...') : ''"
      [disabled]="isDisabled || isMaxReached()"
      [tabindex]="tabIndex"
      (keydown)="onKeyDown($event)"
      (paste)="onPaste($event)"
      (blur)="onInputBlur()"
      class="flex-1 min-w-[120px] bg-transparent text-sm text-gray-900 dark:text-slate-100 placeholder:text-gray-400 dark:placeholder:text-slate-500 focus:outline-none py-1"
    />
  </div>

  @if (errorMessage) {
    <span class="text-xs text-red-500 dark:text-red-400 font-medium">{{ errorMessage }}</span>
  }
</div>
